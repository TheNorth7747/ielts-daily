name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推上去就取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 页面加载的是打包产物，源码改了却没重打包，线上就会跑旧代码。
      # 这里直接重打包并比对，不一致就让 CI 红掉。
      - name: Check bundle is in sync with source
        run: |
          node build.mjs
          if ! git diff --quiet -- assets/app.bundle.js; then
            echo "::error::assets/app.bundle.js 与源码不同步，请本地执行 node build.mjs 后提交"
            git --no-pager diff --stat -- assets/app.bundle.js
            exit 1
          fi

      - name: Smoke test (no deps)
        run: node tests/logic.test.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
